name: Fusion automatique dans dev

on:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: write

concurrency:
  group: merge-into-dev
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Fusionner ${{ github.ref_name }} dans dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${GITHUB_REF_NAME}"
          if ! git merge --no-edit "origin/${GITHUB_REF_NAME}"; then
            git merge --abort
            echo "::error::Conflit en fusionnant ${GITHUB_REF_NAME} dans dev : à résoudre à la main."
            exit 1
          fi
          git push origin dev
